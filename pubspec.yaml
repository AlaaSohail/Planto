name: plant_care
description: "A new Flutter project."

publish_to: 'none'


version: 1.0.0+1

environment:
  sdk: ^3.10.0


dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  dio: ^5.9.1
  flutter_bloc: ^9.1.1
  flutter_offline: ^6.0.0
  flutter_screenutil: ^5.9.3
  image_picker: ^1.0.7
  cached_network_image: ^3.4.1
  flutter_animate: ^4.5.2
  flutter_spinkit: ^5.2.2
  flutter_secure_storage: ^10.3.1
  simple_icons: ^16.23.0
  msh_checkbox: ^2.0.1
  country_picker: ^2.0.28
  lottie: ^3.1.2
  jwt_decoder: ^2.0.1
  shared_preferences: ^2.5.5
  get_it: ^9.2.1
  geolocator: ^14.0.2
  geocoding: ^5.0.0
  google_nav_bar: ^5.0.7
  flutter_facebook_auth: ^7.2.0
  google_sign_in: ^7.2.0
  skeletonizer: ^2.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  change_app_package_name: ^1.5.0








flutter_launcher_icons:

  image_path: "assets/images/icon_luncher.png"
  adaptive_icon_foreground: "assets/images/icon_luncher.png"
  adaptive_icon_background: "#15351b"
  adaptive_icon_foreground_inset: 0







flutter:
  uses-material-design: true


  assets:
    - assets/images/
    - assets/lottie/


  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo.ttf
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Black.ttf




